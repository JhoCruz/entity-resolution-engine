name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install Python and dependencies
        run: uv sync --locked --extra dev

      - name: Verify release version
        run: test "$(uv run entity-resolution-engine --version)" = "1.0.0"

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check types
        run: uv run mypy src tests

      - name: Run tests
        run: uv run pytest

      - name: Exercise documented ingestion command
        run: uv run entity-resolution-engine inspect --config examples/basic-job.toml

      - name: Exercise documented exact baseline command
        run: uv run entity-resolution-engine baseline --config examples/basic-job.toml

      - name: Exercise documented name candidates command
        run: uv run entity-resolution-engine candidates --config examples/name-variants-job.toml

      - name: Exercise local reconciliation reports
        run: |
          uv run entity-resolution-engine reconcile --config examples/name-variants-job.toml --output reports/ci
          test -s reports/ci/summary.json
          test -s reports/ci/reviews.jsonl

      - name: Verify published synthetic benchmark
        run: |
          uv run python scripts/evaluate_benchmark.py --output /tmp/reproduced-benchmark.json
          cmp docs/evaluation/baseline.json /tmp/reproduced-benchmark.json

      - name: Verify synthetic policy and opt-in workflow
        run: |
          uv run python scripts/calibrate_policy.py --output /tmp/reproduced-policy.json
          cmp docs/evaluation/synthetic-policy.json /tmp/reproduced-policy.json
          uv run python scripts/generate_benchmark.py --output-directory benchmarks/ci --seed 20260925
          uv run entity-resolution-engine reconcile --config benchmarks/ci/job.toml --output reports/ci-calibrated --calibration docs/evaluation/synthetic-policy.json
          test -s reports/ci-calibrated/matches.jsonl

      - name: Exercise local performance harness
        run: uv run python scripts/benchmark_performance.py --sizes 8 16 --repeats 1 --output /tmp/performance.json

  package:
    name: Package and container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Build Python package
        run: uv build

      - name: Build container image
        run: docker build --tag entity-resolution-engine:ci .

      - name: Exercise container entry point
        run: docker run --rm entity-resolution-engine:ci doctor

      - name: Verify container release version
        run: test "$(docker run --rm entity-resolution-engine:ci --version)" = "1.0.0"
