name: Feature request
description: Propose a measurable capability or improvement.
title: "Feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which concrete limitation does this solve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Acceptance criteria
      description: How can the result be tested or measured?
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Trade-offs
      description: What complexity, dependencies, or failure modes would this introduce?
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: The proposal can be demonstrated entirely with synthetic data.
          required: true
